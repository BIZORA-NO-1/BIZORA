<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIZORA — Business Workspace</title>
<meta name="description" content="BIZORA is your intelligent AI-powered business management workspace.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
 --bg:#0b1020;--panel:#111a2d;--panel2:#172239;--border:#263550;
 --text:#edf2ff;--muted:#8e9bb5;--accent:#8068ff;--accent2:#a18fff;
 --green:#25c58a;--red:#ff657a;--yellow:#f3b94f;--blue:#54a9ff;
 --shadow:0 12px 35px #0003;--radius:15px
}
body.light{
 --bg:#f3f5fb;--panel:#fff;--panel2:#f6f7fc;--border:#e1e5ef;
 --text:#202943;--muted:#71809a;--shadow:0 10px 30px #1824480c
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;background:var(--panel);border-right:1px solid var(--border);height:100vh;position:fixed;left:0;top:0;z-index:20;display:flex;flex-direction:column}
.brand{height:76px;padding:17px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.brandmark{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#8068ff,#43b7e8);display:grid;place-items:center;font-size:22px;font-weight:900;color:white}
.brand strong{font-size:19px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px;margin-top:3px}
.nav{overflow:auto;padding:12px 10px;flex:1}
.nav-label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.4px;padding:13px 10px 7px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border:0;border-radius:9px;color:var(--muted);background:transparent;text-align:left;margin:2px 0;font-size:12px}
.nav button:hover,.nav button.active{background:#8068ff20;color:var(--accent2)}
.nav button.active{font-weight:700}
.nav .ico{width:19px;text-align:center;font-size:15px}
.sidebar-bottom{padding:12px;border-top:1px solid var(--border)}
.user-mini{display:flex;gap:10px;align-items:center;padding:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:#8068ff35;color:var(--accent2);display:grid;place-items:center;font-weight:bold}
.user-mini small{color:var(--muted);display:block;margin-top:3px}
.main{margin-left:255px;width:calc(100% - 255px);min-height:100vh}
.topbar{height:76px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:15px}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.page-heading{font-size:19px;font-weight:800}
.breadcrumb{font-size:11px;color:var(--muted);margin-top:4px}
.top-actions{display:flex;align-items:center;gap:9px}
.search{width:min(245px,28vw);position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--border);padding:10px 12px;border-radius:10px;color:var(--text);outline:none}
.icon-btn{width:37px;height:37px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px}
.content{padding:25px;max-width:1600px;margin:auto}
.welcome{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:23px}
h1{font-size:24px;margin:0 0 7px}
h2{font-size:17px;margin:0 0 15px}
h3{font-size:14px;margin:0 0 10px}
p{color:var(--muted);line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:11px}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:650;font-size:12px}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.danger{color:var(--red)}
.btn.success{color:var(--green)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat,.panel,.module-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:17px}
.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.stat-value{font-size:26px;font-weight:800;margin:13px 0 5px}
.stat-foot{font-size:11px;color:var(--muted)}
.stat-icon{width:35px;height:35px;border-radius:10px;background:#8068ff20;display:grid;place-items:center;font-size:17px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chart-wrap{height:250px;position:relative}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:14px;text-align:left;color:var(--text)}
.quick span{font-size:20px;display:block;margin-bottom:8px}
.quick strong{font-size:12px}
.quick small{display:block;color:var(--muted);margin-top:4px;font-size:10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 0;flex-wrap:wrap}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:9px;outline:none}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;background:var(--panel2)}
td{color:var(--text)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;background:#8068ff20;color:var(--accent2)}
.pill.green{background:#25c58a20;color:var(--green)}
.pill.red{background:#ff657a20;color:var(--red)}
.pill.yellow{background:#f3b94f20;color:var(--yellow)}
.pill.blue{background:#54a9ff20;color:var(--blue)}
.empty{text-align:center;padding:35px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.module-card{cursor:pointer;transition:.15s}
.module-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.module-card .big-ico{font-size:25px;margin-bottom:13px}
.module-card p{font-size:11px;margin:5px 0 0}
.modal-back{position:fixed;inset:0;background:#0009;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}
.modal-back.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:min(570px,100%);max-height:90vh;overflow:auto;padding:21px;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:11px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;color:var(--text);outline:none}
.field textarea{min-height:85px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.notice{padding:13px;border:1px solid #8068ff55;background:#8068ff12;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.6;margin:12px 0}
.integration{padding:17px;border:1px solid var(--border);border-radius:12px;background:var(--panel2)}
.integration .ico{font-size:24px;margin-bottom:10px}
.settings-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid var(--border)}
.mobile-menu{display:none}
#toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);border:1px solid var(--border);padding:12px 17px;border-radius:10px;z-index:200;box-shadow:var(--shadow);display:none}
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;place-items:center;padding:20px}
.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);padding:25px;border-radius:18px}
.auth-card input{width:100%;padding:12px;margin:7px 0 12px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;color:var(--text)}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
 .sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}
 .main{margin-left:0;width:100%}.mobile-menu{display:block}
 .topbar{padding:0 13px;height:66px}.content{padding:16px}
 .search{width:37vw}.grid2{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}
 .cards{grid-template-columns:1fr 1fr}.welcome{align-items:flex-start;flex-direction:column}
}
@media(max-width:430px){.stats{gap:9px}.stat{padding:12px}.stat-value{font-size:21px}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-heading{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brandmark">B</div><div><strong>BIZORA</strong><small>BUSINESS WORKSPACE</small></div></div>
 <nav class="nav" id="navigation"></nav>
 <div class="sidebar-bottom">
  <div class="user-mini"><div class="avatar" id="userAvatar">B</div><div><strong id="userName">Business Owner</strong><small id="userEmail">Local workspace</small></div></div>
  <button class="btn" style="width:100%" onclick="signOut()">↪ Sign out</button>
 </div>
</aside>
<main class="main">
 <header class="topbar">
  <div class="top-left">
   <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>

  </div>
  <div class="top-actions">
   <div class="search"><input id="globalSearch" placeholder="Search workspace..." oninput="globalSearch(this.value)"></div>

   <button class="icon-btn" onclick="toast('Notifications center is ready for integration.')" title="Notifications">♧</button>
  </div>
 </header>
 <section class="content" id="content"></section>
</main>
</div>

<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()">
 <div class="modal">
  <div class="modal-head"><h2 id="modalTitle">Add record</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
  <form id="recordForm" onsubmit="saveRecord(event)">
   <div class="form-grid" id="formFields"></div>
   <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save record</button></div>
  </form>
 </div>
</div>
<div id="toast"></div>

<div id="authScreen">
 <div class="auth-card">
  <div class="brand" style="padding:0;border:0;margin-bottom:20px"><div class="brandmark">B</div><div><strong>BIZORA</strong><small>BUSINESS WORKSPACE</small></div></div>
  <h2 id="authTitle">Welcome back</h2><p>Sign in to your business workspace.</p>
  <form onsubmit="handleAuth(event)">
   <label>Email</label><input id="authEmail" type="email" required placeholder="you@example.com">
   <label>Password</label><input id="authPassword" type="password" required minlength="6" placeholder="Your password">
   <button class="btn primary" style="width:100%;margin-top:8px" id="authSubmit">Sign in</button>
  </form>
  <p class="small" id="authSwitch">New here? <a href="#" onclick="toggleAuthMode(event)">Create an account</a></p>
  <button class="btn" style="width:100%" onclick="continueDemo()">Continue in demo mode</button>
  <p class="small">Authentication uses your connected Supabase project when available.</p>
 </div>
</div>

 try{records=JSON.parse(localStorage.getItem("bizora_records")||"{}")}catch(e){records={}}

function simpleTable(id,data,cols){

function renderDataTable(id,data){

function statusClass(s){s=String(s||"").toLowerCase();if(["paid","completed","resolved","active","published","done"].includes(s))return"green";if(["cancelled","overdue","urgent","inactive"].includes(s))return"red";if(["pending","draft","planning","unread","in progress"].includes(s))return"yellow";return"blue"}

function openForm(id,record=null){
 let m=getModule(id);if(!m)return;
 if(!m.fields){toast("This section is a connection workspace.");return}
 activeFormModule=id;editingId=record?.id||null;
 document.getElementById("modalTitle").textContent=(record?"Edit ":"Add ")+m.name;
 document.getElementById("formFields").innerHTML=m.fields.map(f=>{
 let [key,label,type,required,options]=f,val=record?.[key]??"";
 let input=type==="textarea"?`<textarea name="${key}" placeholder="${label}">${esc(val)}</textarea>`:type==="select"?`<select name="${key}">${(options||[]).map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input name="${key}" type="${type}" value="${esc(val)}" placeholder="${label}" ${required?"required":""} ${type==="number"?'step="any"':""}>`;
 return `<div class="field ${type==="textarea"?"full":""}"><label>${label}${required?" *":""}</label>${input}</div>`;
 }).join("");
 document.getElementById("modalBack").classList.add("show");
}
function closeModal(){document.getElementById("modalBack").classList.remove("show")}
async function saveRecord(e){
 e.preventDefault();

 let id=activeFormModule,
 form=new FormData(e.target),
 obj={};

 for(let [k,v] of form.entries())obj[k]=v;

 obj.id=editingId||("r"+Date.now());

 // Supabase connection for Products
 if(id==="products"){

  if(!sb || !currentUser){
   toast("Please sign in first.");
   return;
  }

  let productData={
   user_id:currentUser.id,
   name:obj.name||"",
   sku:obj.sku||null,
   category:obj.category||null,
   price:Number(obj.price||0),
   cost:Number(obj.cost||0),
   stock:Number(obj.stock||0),
   min_stock:Number(obj.minStock||0),
   supplier:obj.supplier||null,
   description:obj.description||null
  };

  try{
   let result;

   if(editingId && !String(editingId).startsWith("r")){
    result=await sb.from("products")
     .update(productData)
     .eq("id",editingId)
     .eq("user_id",currentUser.id)
     .select()
     .single();
   }else{
    result=await sb.from("products")
     .insert(productData)
     .select()
     .single();
   }

   if(result.error)throw result.error;

   let saved=result.data;

   let product={
    id:saved.id,
    name:saved.name,
    sku:saved.sku,
    category:saved.category,
    price:saved.price,
    cost:saved.cost,
    stock:saved.stock,
    minStock:saved.min_stock,
    supplier:saved.supplier,
    description:saved.description
   };

   let data=list(id);
   let index=data.findIndex(x=>x.id===editingId||x.id===product.id);

   if(index>=0)data[index]=product;
   else data.push(product);

   saveList(id,data);
   closeModal();
   renderPage();
   toast("Product saved to Supabase.");

  }catch(error){
   console.error(error);
   toast("Product save failed: "+error.message);
  }

  return;
 }

 // Existing save system for other modules
 let data=list(id),
 index=data.findIndex(x=>x.id===obj.id);

 if(index>=0)data[index]=obj;
 else data.push(obj);

 saveList(id,data);
 closeModal();
 renderPage();
 toast(index>=0?"Record updated.":"Record saved.");
}

function downloadCSV(name,data){
 let keys=[...new Set(data.flatMap(x=>Object.keys(x)))];
 let csv=[keys.join(","),...data.map(r=>keys.map(k=>'"'+String(r[k]??"").replace(/"/g,'""')+'"').join(","))].join("\n");
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="bizora-"+name+".csv";a.click();URL.revokeObjectURL(a.href);
}

function toggleAuthMode(e){e.preventDefault();authMode=authMode==="login"?"signup":"login";document.getElementById("authTitle").textContent=authMode==="login"?"Welcome back":"Create your account";document.getElementById("authSubmit").textContent=authMode==="login"?"Sign in":"Create account";document.getElementById("authSwitch").innerHTML=authMode==="login"?'New here? <a href="#" onclick="toggleAuthMode(event)">Create an account</a>':'Already registered? <a href="#" onclick="toggleAuthMode(event)">Sign in</a>'}
async function handleAuth(e){
 e.preventDefault();if(!sb){toast("Supabase is unavailable. You can continue in demo mode.");return}
 let email=document.getElementById("authEmail").value,password=document.getElementById("authPassword").value;
 let res=authMode==="login"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(res.error){toast(res.error.message);return}
 if(res.data.user){currentUser=res.data.user;setUser(currentUser);document.getElementById("authScreen").style.display="none";toast(authMode==="login"?"Signed in successfully.":"Account created.");}
}
function setUser(u){
  currentUser = u || null;

  document.getElementById("userEmail").textContent =
    u?.email || "Local workspace";

  document.getElementById("userName").textContent =
    u?.user_metadata?.full_name || "Business Owner";

  document.getElementById("userAvatar").textContent =
    (u?.email || "B").charAt(0).toUpperCase();

  const authButton = document.querySelector(".sidebar-bottom button");
  if(authButton){
    authButton.textContent = u ? "↪ Sign out" : "↪ Sign in";
  }
}

function showAuthScreen(){
  authMode = "login";

  document.getElementById("authTitle").textContent = "Welcome back";
  document.getElementById("authSubmit").textContent = "Sign in";

  document.getElementById("authSwitch").innerHTML =
    'New here? <a href="#" onclick="toggleAuthMode(event)">Create an account</a>';

  document.getElementById("authScreen").style.display = "grid";
}

async function handleAuth(e){
  e.preventDefault();

  if(!sb){
    toast("Supabase is unavailable. Please try again.");
    return;
  }

  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  try{
    const res = authMode === "login"
      ? await sb.auth.signInWithPassword({email, password})
      : await sb.auth.signUp({email, password});

    if(res.error){
      toast(res.error.message);
      return;
    }

    if(res.data.session && res.data.user){
      setUser(res.data.user);
      document.getElementById("authScreen").style.display = "none";
      toast(authMode === "login" ? "Signed in successfully." : "Account created.");
    }else if(res.data.user){
      toast("Account created. Check your email to confirm, then sign in.");
    }

  }catch(error){
    toast(error.message || "Authentication failed.");
  }
}

function continueDemo(){
  setUser(null);
  document.getElementById("authScreen").style.display = "none";
  toast("Demo workspace opened.");
}

async function signOut(){
  try{
    if(sb && currentUser){
      const {error} = await sb.auth.signOut();
      if(error) throw error;
    }

    setUser(null);
    showAuthScreen();
    toast("Signed out. Please sign in again.");

  }catch(error){
    toast(error.message || "Sign out failed.");
  }
}

async function initAuth(){
  if(!sb){
    setUser(null);
