<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>BIZORA — Business Workspace</title>
<meta name="description" content="BIZORA all-in-one business management workspace.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--bg:#0b1020;--panel:#111a2d;--panel2:#172239;--text:#f4f6ff;
--muted:#929db5;--border:#ffffff13;--accent:#8068ff;
--green:#37c995;--red:#ff7185;--shadow:0 12px 35px #0002
}
body.light{
--bg:#f4f6fb;--panel:#fff;--panel2:#f0f2f9;--text:#192239;
--muted:#73809a;--border:#19223916;--accent:#7057ed;
--shadow:0 12px 35px #1922390c
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 13px;position:fixed;inset:0 auto 0 0;overflow-y:auto;z-index:30;display:flex;flex-direction:column;transition:.25s}
.brand{display:flex;align-items:center;gap:11px;padding:5px 9px 25px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#967bff,#5741d5);display:grid;place-items:center;color:white;font-size:22px;font-weight:900}
.brand-name{font-size:21px;font-weight:900;letter-spacing:1px}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.4px;margin-top:4px}
.section-label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.3px;padding:15px 10px 7px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border:0;border-radius:9px;background:none;color:var(--muted);text-align:left;font-size:12px;margin:2px 0}
.nav-item:hover,.nav-item.active{background:#8068ff20;color:var(--accent);font-weight:750}
.nav-icon{width:20px;text-align:center;font-size:15px}
.sidebar-bottom{margin-top:auto;padding-top:20px}
.profile{display:flex;align-items:center;gap:9px;padding:15px 5px 3px;border-top:1px solid var(--border)}
.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#6654d8;color:white;font-weight:bold}
.profile-info{flex:1;min-width:0}
.profile-info strong,.profile-info span{display:block;overflow:hidden;text-overflow:ellipsis}
.profile-info strong{font-size:11px}
.profile-info span{font-size:9px;color:var(--muted)}
.main{margin-left:255px;min-width:0;flex:1}
.topbar{height:68px;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.top-left,.top-right{display:flex;align-items:center;gap:10px}
.menu-btn{display:none;background:none;border:0;color:var(--text);font-size:23px}
.search{width:260px;background:var(--panel2);border:1px solid var(--border);padding:9px 12px;border-radius:9px;display:flex;gap:8px}
.search input{background:none;border:0;outline:0;color:var(--text);width:100%;font-size:12px}
.icon-btn{width:36px;height:36px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.page{padding:27px;max-width:1600px;margin:auto}
.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:22px}
.heading h1{font-size:24px;margin:0 0 7px}
.heading p{font-size:12px;color:var(--muted);margin:0}
.primary,.secondary,.danger{border:0;border-radius:9px;padding:10px 15px;font-size:12px;font-weight:700}
.primary{background:linear-gradient(120deg,#8068ff,#6047dc);color:white}
.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.danger{background:#ff71851c;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:17px;box-shadow:var(--shadow);min-width:0}
.stat-label{font-size:11px;color:var(--muted)}
.stat-value{font-size:25px;font-weight:850;margin:12px 0 5px}
.stat-note{font-size:10px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-bottom:17px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card-title{font-size:14px;font-weight:750;margin:0 0 16px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick{padding:15px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;color:var(--text);text-align:center}
.quick span{font-size:23px;display:block;margin-bottom:7px}
.quick strong{font-size:11px}
.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.module-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer}
.module-card:hover{border-color:var(--accent)}
.module-card .ico{font-size:23px;margin-bottom:12px}
.module-card strong{font-size:12px;display:block;margin-bottom:7px}
.module-card p{font-size:10px;line-height:1.6;color:var(--muted);margin:0}
.module-card small{display:block;color:var(--accent);margin-top:13px;font-size:10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar input{max-width:300px}
.field{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px;color:var(--text);outline:none;font-size:12px}
.field:focus{border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-group label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}
.form-group.full{grid-column:1/-1}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:650px;font-size:11px}
th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--panel2);color:var(--muted);font-size:10px}
td{color:var(--text)}
tr:last-child td{border:0}
.actions{display:flex;gap:6px}
.small-btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:6px 8px;border-radius:6px;font-size:10px}
.status{padding:5px 8px;border-radius:20px;background:#37c99520;color:var(--green);font-size:9px}
.empty{text-align:center;padding:35px;color:var(--muted);font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-box{background:var(--panel);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;border:1px solid var(--border);border-radius:15px;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h2{font-size:17px;margin:0}
.toast{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--panel2);border:1px solid var(--border);padding:13px 17px;border-radius:9px;display:none;font-size:12px;max-width:90%}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:25}
.overlay.show{display:block}
.auth-screen{position:fixed;inset:0;background:#0b1020;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{width:100%;max-width:410px;background:#111a2d;color:white;padding:28px;border-radius:17px}
.auth-box h1{text-align:center;color:#a18cff;letter-spacing:2px}
.auth-box h2{text-align:center}
.auth-box p{text-align:center;color:#929db5;font-size:12px}
.auth-input{width:100%;padding:13px;margin:6px 0;background:#172239;color:white;border:1px solid #ffffff22;border-radius:8px}
.auth-submit{width:100%;padding:13px;margin-top:10px;background:#8068ff;color:white;border:0;border-radius:8px;font-weight:bold}
.auth-message{color:#ff7185!important}
a{color:var(--accent)}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
.sidebar{transform:translateX(-105%);width:260px}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.menu-btn{display:block}
.topbar{height:60px;padding:0 13px}
.search{width:min(43vw,210px)}
.page{padding:19px 13px}
.grid2{grid-template-columns:1fr}
.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.quick-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){
.module-grid{grid-template-columns:1fr}
.stats{gap:8px}
.card{padding:12px}
.stat-value{font-size:21px}
.form-grid{grid-template-columns:1fr}
.form-group.full{grid-column:auto}
}
</style>
</head>

<main class="main">

<script>
/* SUPABASE AUTH */
const SUPABASE_URL="https://uidalntoqcwsxxcplctl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_O4cxJaXrIMWfP2S63HQd8w_KD9yHwCF";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

let authMode="login",currentUser=null;
const $=id=>document.getElementById(id);

function switchAuth(){
 authMode=authMode==="login"?"signup":"login";
 $("authTitle").textContent=authMode==="login"?"Welcome Back":"Create Account";
 $("authSubmit").textContent=authMode==="login"?"Login":"Create Account";
 $("switchText").textContent=authMode==="login"?"Don't have an account?":"Already have an account?";
 $("switchButton").textContent=authMode==="login"?"Sign Up":"Login";
 $("authName").style.display=authMode==="signup"?"block":"none";
 $("authMessage").textContent="";
}
async function handleAuth(){
 const email=$("authEmail").value.trim(),password=$("authPassword").value;
 const name=$("authName").value.trim(),btn=$("authSubmit");
 if(!email||!password)return $("authMessage").textContent="Enter your email and password.";
 if(password.length<6)return $("authMessage").textContent="Password must be at least 6 characters.";
 if(authMode==="signup"&&!name)return $("authMessage").textContent="Enter your name.";
 btn.disabled=true;btn.textContent="Please wait...";
 try{
  let result;
  if(authMode==="signup"){
   result=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name}}});
   if(result.error)throw result.error;
   if(result.data.session)showApp(result.data.user);
   else $("authMessage").textContent="Account created. Check your email to confirm it.";
  }else{
   result=await supabaseClient.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
   showApp(result.data.user);
  }
 }catch(e){$("authMessage").textContent=e.message}
 finally{btn.disabled=false;btn.textContent=authMode==="login"?"Login":"Create Account"}
}
async function logout(){
 const {error}=await supabaseClient.auth.signOut();
 if(error)return notify(error.message);
 currentUser=null;$("app").style.visibility="hidden";$("authScreen").style.display="flex";
}
function showApp(user){
 currentUser=user;
 $("authScreen").style.display="none";$("app").style.visibility="visible";
 const name=user.user_metadata?.full_name||user.email.split("@")[0];
 $("profileName").textContent=name;$("profileEmail").textContent=user.email;
 $("avatar").textContent=name[0].toUpperCase();$("topAvatar").textContent=name[0].toUpperCase();
 renderNavigation();goTo("Overview");
}
async function initializeAuth(){
 const {data,error}=await supabaseClient.auth.getSession();
 if(error){$("authMessage").textContent=error.message;return}
 if(data.session)showApp(data.session.user);
}
supabaseClient.auth.onAuthStateChange((event,session)=>{
 if(session)showApp(session.user);
});

/* LOCAL RECORD STORAGE */
let records={};
let currentModule="Overview";
let editingId=null;

function loadRecords(){
 try{records=JSON.parse(localStorage.getItem("bizora_records")||"{}")}
 catch(e){records={}}
}
function saveRecordsToStorage(){
 localStorage.setItem("bizora_records",JSON.stringify(records));
}
function getRecords(name){return records[name]||[]}
function moduleList(){return groups.flatMap(g=>g[1].map(x=>x[0]))}
function renderNavigation(){
 $("navigation").innerHTML=groups.map(group=>`
 <div class="section-label">${group[0]}</div>
 ${group[1].map(m=>`<button class="nav-item" data-page="${m[0]}" onclick="goTo('${m[0].replace(/'/g,"\\'")}')"><span class="nav-icon">${m[1]}</span>${m[0]}</button>`).join("")}
 `).join("");
}
function goTo(name){
 currentModule=name;
 document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===name));
 if(name==="Overview")renderDashboard();else renderModule(name);
 $("sidebar").classList.remove("open");$("overlay").classList.remove("show");
 window.scrollTo(0,0);
}
function globalFilter(value){
 const q=value.toLowerCase();
 if(!q){goTo("Overview");return}
 const found=moduleList().filter(n=>n.toLowerCase().includes(q));
 $("page").innerHTML=`<div class="heading"><div><h1>Search Results</h1><p>Matching BIZORA modules</p></div></div><div class="module-grid">${found.map(n=>moduleCard(n)).join("")}</div>`;
}
function moduleCard(name){
 const group=groups.flatMap(g=>g[1]).find(x=>x[0]===name);
 return `<div class="module-card" onclick="goTo('${name.replace(/'/g,"\\'")}')"><div class="ico">${group[1]}</div><strong>${name}</strong><p>${descriptions[name]}</p><small>Open module →</small></div>`;
}
function renderDashboard(){
 const products=getRecords("Products & Inventory");
 const customers=getRecords("Customers (CRM)");
 const orders=getRecords("Orders & Sales");
 const revenue=orders.reduce((s,r)=>s+Number(r["Total Amount"]||0),0);
 const currency=n=>new Intl.NumberFormat("en-PK",{maximumFractionDigits:2}).format(n);
 $("page").innerHTML=`
 <div class="heading"><div><h1>Business Overview</h1><p>Welcome to BIZORA. Your business workspace.</p></div><button class="primary" onclick="goTo('Products & Inventory')">＋ Add Product</button></div>
 <div class="stats">
 <div class="card"><div class="stat-label">Total Products</div><div class="stat-value">${products.length}</div><div class="stat-note">Saved product records</div></div>
 <div class="card"><div class="stat-label">Total Customers</div><div class="stat-value">${customers.length}</div><div class="stat-note">Saved customer records</div></div>
 <div class="card"><div class="stat-label">Total Orders</div><div class="stat-value">${orders.length}</div><div class="stat-note">Saved sales records</div></div>
 <div class="card"><div class="stat-label">Recorded Revenue</div><div class="stat-value">${currency(revenue)}</div><div class="stat-note">Based on recorded orders</div></div>
 </div>
 <div class="grid2">
 <div class="card"><h3 class="card-title">Business Workspace</h3><p style="font-size:12px;color:var(--muted);line-height:1.8">Manage your products, customers, orders, expenses, communications and business operations from one central workspace.</p><div class="quick-grid">
 <button class="quick" onclick="goTo('Products & Inventory')"><span>▣</span><strong>Products</strong></button>
 <button class="quick" onclick="goTo('Customers (CRM)')"><span>♙</span><strong>Customers</strong></button>
 <button class="quick" onclick="goTo('Orders & Sales')"><span>🛍</span><strong>Sales</strong></button>
 <button class="quick" onclick="goTo('Invoices & Payments')"><span>▤</span><strong>Invoices</strong></button>
 </div></div>
 <div class="card"><h3 class="card-title">Low Stock Alerts</h3>${products.filter(p=>Number(p["Stock Quantity"]||0)<=Number(p["Low Stock Alert"]||0)).length?products.filter(p=>Number(p["Stock Quantity"]||0)<=Number(p["Low Stock Alert"]||0)).map(p=>`<p style="font-size:11px">${escapeHTML(p["Product Name"])} — ${p["Stock Quantity"]} remaining</p>`).join(""):'<div class="empty">No low-stock alerts yet.</div>'}</div>
 </div>
 <div class="card" style="margin-bottom:17px"><h3 class="card-title">All Business Modules</h3><div class="module-grid">${moduleList().filter(n=>n!=="Overview").map(moduleCard).join("")}</div></div>
 <div class="card"><h3 class="card-title">Recent Orders</h3>${renderTable("Orders & Sales",orders.slice(-5).reverse(),false)}</div>`;
}
function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function renderModule(name){
 const list=getRecords(name),hasFields=!!fields[name];
 const isSettings=["Security & Settings","Subscription & Billing","Roles & Permissions","App Integrations","WhatsApp Integration","Email Management"].includes(name);
 $("page").innerHTML=`
 <div class="heading"><div><h1>${escapeHTML(name)}</h1><p>${escapeHTML(descriptions[name])}</p></div><button class="secondary" onclick="goTo('Overview')">← Overview</button></div>
 <div class="stats">
 <div class="card"><div class="stat-label">Total Records</div><div class="stat-value">${list.length}</div><div class="stat-note">Saved in this workspace</div></div>
 <div class="card"><div class="stat-label">Module Status</div><div class="stat-value" style="font-size:17px">Available</div><div class="stat-note">Interface ready</div></div>
 <div class="card"><div class="stat-label">Storage</div><div class="stat-value" style="font-size:17px">Browser</div><div class="stat-note">Local records</div></div>
 <div class="card"><div class="stat-label">Integration</div><div class="stat-value" style="font-size:17px">Pending</div><div class="stat-note">Backend connection required</div></div>
 </div>
 <div class="card">
 <div class="toolbar"><div><h3 class="card-title" style="margin:0">${escapeHTML(name)} Records</h3><span style="font-size:10px;color:var(--muted)">Add and manage your information</span></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="field" style="width:145px" id="recordSearch" placeholder="Search records..." oninput="filterRecords()"><button class="secondary" onclick="exportCSV()">Export CSV</button>${hasFields?'<button class="primary" onclick="openForm()">＋ Add New</button>':''}</div></div>
 <div id="recordsTable">${renderTable(name,list)}</div>
 </div>
 ${isSettings?`<div class="card" style="margin-top:15px"><h3 class="card-title">Connection & Configuration</h3><p style="font-size:12px;color:var(--muted);line-height:1.8">This module has its management interface. External service connections, payment providers, team access controls and live communication require their respective secure backend integrations.</p></div>`:""}
 `;
}
function renderTable(name,list,actions=true){
 const cols=(fields[name]||[]).map(f=>f[0]);
 if(!list.length)return '<div class="empty">No records yet. Add your first record to get started.</div>';
 const visible=cols.slice(0,5);
 return `<div class="table-wrap"><table><thead><tr>${visible.map(c=>`<th>${escapeHTML(c)}</th>`).join("")}<th>Actions</th></tr></thead><tbody>
 ${list.map(r=>`<tr>${visible.map(c=>`<td>${escapeHTML(r[c]||"—")}</td>`).join("")}<td><div class="actions">${actions?`<button class="small-btn" onclick="editRecord('${r._id}')">Edit</button><button class="small-btn" style="color:var(--red)" onclick="deleteRecord('${r._id}')">Delete</button>`:'<span class="status">Saved</span>'}</div></td></tr>`).join("")}
 </tbody></table></div>`;
}
function filterRecords(){
 const q=$("recordSearch").value.toLowerCase();
 const list=getRecords(currentModule).filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));
 $("recordsTable").innerHTML=renderTable(currentModule,list);
}
function openForm(id=null){
 if(!fields[currentModule])return notify("This module is awaiting its integration.");
 editingId=id;
 const old=id?getRecords(currentModule).find(r=>r._id===id):{};
 $("modalTitle").textContent=id?"Edit Record":"Add "+currentModule+" Record";
 $("formFields").innerHTML=fields[currentModule].map(([label,type])=>{
  let input;
  if(type==="textarea")input=`<textarea class="field" name="${escapeHTML(label)}" rows="3">${escapeHTML(old?.[label]||"")}</textarea>`;
  else if(type.startsWith("select:"))input=`<select class="field" name="${escapeHTML(label)}">${type.slice(7).split(",").map(o=>`<option ${old?.[label]===o?"selected":""}>${o}</option>`).join("")}</select>`;
  else input=`<input class="field" name="${escapeHTML(label)}" type="${type}" value="${escapeHTML(old?.[label]||"")}" ${type==="number"?'step="any"':""}>`;
  return `<div class="form-group ${type==="textarea"?"full":""}"><label>${escapeHTML(label)}</label>${input}</div>`;
 }).join("");
 $("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show");editingId=null}
function saveRecord(e){
 e.preventDefault();
 const data=Object.fromEntries(new FormData(e.target).entries());
 if(Object.values(data).every(v=>!String(v).trim()))return notify("Enter some information first.");
 const list=getRecords(currentModule);
 if(editingId){
  const i=list.findIndex(r=>r._id===editingId);
  if(i>=0)list[i]={...list[i],...data};
 }else list.push({...data,_id:Date.now().toString()});
 records[currentModule]=list;saveRecordsToStorage();closeModal();renderModule(currentModule);notify("Record saved successfully.");
}
function editRecord(id){openForm(id)}
function deleteRecord(id){
 if(!confirm("Are you sure you want to delete this record?"))return;
 records[currentModule]=getRecords(currentModule).filter(r=>r._id!==id);
 saveRecordsToStorage();renderModule(currentModule);notify("Record deleted.");
}
function exportCSV(){
 const list=getRecords(currentModule),cols=(fields[currentModule]||[]).map(f=>f[0]);
 if(!list.length)return notify("There are no records to export.");
 const csv=[cols.join(","),...list.map(r=>cols.map(c=>'"'+String(r[c]??"").replace(/"/g,'""')+'"').join(","))].join("\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=currentModule.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".csv";a.click();URL.revokeObjectURL(url);
}
function toggleTheme(){
 document.body.classList.toggle("light");
 localStorage.setItem("bizora_theme",document.body.classList.contains("light")?"light":"dark");
}
function toggleMenu(force){
 const open=force===false?false:!$("sidebar").classList.contains("open");
 $("sidebar").classList.toggle("open",open);$("overlay").classList.toggle("show",open);
}
let toastTimer;
function notify(message){
 const t=$("toast");t.textContent=message;t.style.display="block";
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",2800);
}
if(localStorage.getItem("bizora_theme")==="light")document.body.classList.add("light");
loadRecords();
initializeAuth();
</script>
</body>
</html>
